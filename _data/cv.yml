- title: Research Experience
  type: time_table
  contents:
    - title: Graduate Research Assistant / Fellow
      institution: C-BRIC / NRL Lab, Purdue University
      location: West Lafayette, IN
      year: Aug 2021 — Present
    - title: "HEART: Geometry-Aware Controllable Diffusion Generation"
      institution: C-BRIC / NRL Lab, Purdue University
      year: "2026"
      description:
        - Developed a training-free, geometry-aware framework for controllable diffusion generation by modeling text embeddings on their intrinsic hyperspherical geometry and replacing conventional Euclidean semantic edits with Kent-representation traversal.
        - Enabled precise subject and attribute edits across UNet and DiT models with strong scene preservation.
        - Achieved the best BG-/FG-LPIPS trade-off and lowest application overhead among compared methods. Published at NeurIPS 2026.
    - title: "CURE: Training-Free Concept Unlearning in Diffusion Models"
      institution: C-BRIC / NRL Lab, Purdue University
      year: 2024 — 2025
      description:
        - Developed a fast, training-free concept-unlearning framework that performs closed-form cross-attention weight editing using orthogonal projection and spectral representation geometry.
        - Performed closed-form text-attention editing for concept removal, improving erasure by up to 16% while preserving image quality and adversarial robustness. Published at NeurIPS 2025 (Spotlight).
    - title: "SlimDiff: Training-Free Diffusion Model Compression"
      institution: C-BRIC / NRL Lab, Purdue University
      year: 2024 — 2025
      description:
        - Developed an activation-guided, timestep-aware diffusion compression framework using operator-aware low-rank decomposition.
        - Achieved 35% faster inference and approximately 100M parameter reduction while preserving generation quality.
        - Designed SlimSet, a 500-sample calibration set, and spectral influence criteria for activation–weight and timestep-aware profiling, reducing calibration cost by 98%.
    - title: Backpropagation-Free Learning via Structured Low-Rank Geometry
      institution: C-BRIC / NRL Lab, Purdue University
      year: 2023 — 2025
      description:
        - Developed a backpropagation-free local-learning framework combining Direct Feedback Alignment with low-rank manifold constraints.
        - Used orthogonality-preserving updates on low-rank manifolds to improve representation alignment and achieve performance competitive with backpropagation while maintaining low inference overhead.
        - Scaled to 32-layer ResNets and ImageNet-scale settings. Published at CVPRW 2025 and WACV 2026 (Oral), receiving the Best Student Paper – Algorithms Award.
    - title: Hardware-Algorithm Co-design for Efficient Neural Networks
      institution: C-BRIC / NRL Lab, Purdue University
      year: 2022 — 2023
      description:
        - Developed a non-uniform, approximate-multiplier-aware quantization framework co-optimized with the target accelerator architecture.
        - Demonstrated approximately 3.5× energy savings and 1.3× speedup while maintaining model accuracy. Published at ISCAS 2025.

- title: Ongoing Projects
  type: nested_list
  contents:
    - title: "ARC: Aligned Riemannian Concept Erasure in Diffusion Models"
      items:
        - Developing a geometry-aware concept and feature unlearning framework that models diffusion-model text representations on a hyperspherical manifold and derives geodesic projection operators for localized, training-free concept and feature removal while preserving neighboring semantics.
    - title: Feature and Concept Unlearning in Large Language Models
      items:
        - Analyzing and disentangling LLM representation spaces to understand how semantic features, concepts, and task-specific knowledge are encoded across transformer layers, with the goal of enabling concept-level and sequential-task unlearning while preserving unrelated model capabilities.
    - title: Semantic Reconstruction and Parallel Reasoning in Diffusion Language Models
      items:
        - Developing a position-relaxed reconstruction objective for masked diffusion language models to improve deep-mask semantic reconstruction and enable more effective parallel decoding on language and reasoning tasks.
    - title: Model- and Task-Aware Data Curation for Multimodal Learning
      items:
        - Developing data curation methods that select samples with respect to the modality gap, improving cross-modal alignment and data efficiency for vision-language models.

