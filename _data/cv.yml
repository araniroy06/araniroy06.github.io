      institution: Texas Instruments · Kilby Labs
      location: Dallas, TX
      year: May 2023 — Aug 2023
      description:
        - Prototyped a digital compute-in-flash architecture for neural-network matrix-vector workloads and ported a 65 nm design to 28 nm flash, analyzing energy-throughput trade-offs.
