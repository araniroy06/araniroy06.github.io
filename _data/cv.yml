- title: Experience
  type: time_table
  contents:
    - title: Graduate Research Assistant / Fellow
      institution: C-BRIC / NRL Lab, Purdue University
      location: West Lafayette, IN
      year: Aug 2021 — Present
      description:
        - Developed HEART, a training-free geometry-aware framework for controllable diffusion generation using hyperspherical text-representation geometry and Kent-representation traversal; published at NeurIPS 2026.
        - Developed CURE, a fast training-free concept-unlearning framework using closed-form cross-attention weight editing with orthogonal projection and spectral representation geometry; published at NeurIPS 2025 as a Spotlight.
        - Developed SlimDiff, an activation-guided, timestep-aware diffusion compression framework using operator-aware low-rank decomposition; achieved 35% faster inference and approximately 100M parameter reduction while preserving generation quality.
        - Developed backpropagation-free local-learning methods combining Direct Feedback Alignment with structured low-rank geometry; work appeared at CVPRW 2025 and WACV 2026, where it was presented as an Oral and received the Best Student Paper – Algorithms Award.
        - Developed hardware-algorithm co-design methods for efficient neural networks, demonstrating approximately 3.5× energy savings and 1.3× speedup while maintaining model accuracy; published at ISCAS 2025.
      linkitems:
        - linkname: Projects
          link: /projects/
        - linkname: Publications
          link: /publications/
