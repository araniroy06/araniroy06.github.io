- title: Research Summary
  type: list
  contents:
    - Ph.D. researcher working on generative AI across multimodal and language models, including diffusion models, diffusion language models, and LLMs; representation geometry; model unlearning; efficient reasoning; and efficient deep learning.
    - Research focuses on developing training-free and geometry-aware methods for controlling, analyzing, compressing, and selectively modifying foundation models, along with faster reasoning, backpropagation-free learning, and compression-aware training for efficient AI systems.

