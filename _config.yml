# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title:                  blank # the website title (if blank, full name will be used instead)
first_name:             Arani
middle_name:
last_name:              Roy
email:                  roy173@purdue.edu
description:            > # the ">" symbol means to ignore newlines until "footer_text:"
  Ph.D. researcher in Electrical and Computer Engineering at Purdue University,
  working on efficient and trustworthy generative AI — diffusion-model compression,
  machine unlearning, and local-learning alternatives to backpropagation.
footer_text:            >
  Powered by <a href="https://jekyllrb.com/" target="_blank" rel="external nofollow noopener">Jekyll</a>
  with <a href="https://github.com/alshedivat/al-folio" target="_blank" rel="external nofollow noopener">al-folio</a> theme.
  Hosted by <a href="https://pages.github.com/" target="_blank" rel="external nofollow noopener">GitHub Pages</a>.

keywords:               diffusion models, model compression, machine unlearning, local learning, trustworthy ML, generative AI
lang:                   en
icon:                   👋

# -----------------------------------------------------------------------------
# RSS Feed
# -----------------------------------------------------------------------------
rss_icon:               true

# -----------------------------------------------------------------------------
# Site behavior
# -----------------------------------------------------------------------------

# THIS IS THE CRITICAL FIX FOR YOUR BROKEN LINKS
# When you're at https://araniroy06.github.io/ (a user site),
# the baseurl MUST be empty. The default al-folio config sets it to
# "/al-folio" because their demo lives at alshedivat.github.io/al-folio/.
url:                    https://araniroy06.github.io
baseurl:                "" # Was "/al-folio" — this was breaking every link on your site

last_updated:           false # set to true if you want to display last updated in the footer
impressum_path:         # set to path to include impressum link in the footer, use the same path as permalink in a page, helps to conform with EU GDPR

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed:           true
footer_fixed:           true

# Dimensions
max_width:              930px

# TODO: add layout settings (single page vs. multi-page)

# -----------------------------------------------------------------------------
# Open Graph & Schema.org
# -----------------------------------------------------------------------------

# Display links to the page with all open graph & schema.org metadata tags for debugging.
# In a future release, social_media_card will be supported.
serve_og_meta:          false # Include Open Graph meta tags in the HTML head
serve_schema_org:       false # Include Schema.org in the HTML head
og_image:               # The site-wide (default for all links) Open Graph preview image

# -----------------------------------------------------------------------------
# Social integration
# -----------------------------------------------------------------------------

github_username:        # your GitHub username — TODO add yours
gitlab_username:        # your GitLab username
twitter_username:       # your Twitter handle
mastodon_username:      # your mastodon instance+username in the format instance.tld/@username
linkedin_username:      # your LinkedIn user name — TODO add yours
scholar_userid:         # your Google Scholar ID — TODO add yours (the string after user= in your profile URL)
semanticscholar_id:     # your Semantic Scholar ID
whatsapp_number:        # your WhatsApp number (full phone number in international format. Omit any zeroes, brackets, or dashes when adding the phone number in international format.)
orcid_id:               # your ORCID ID
medium_username:        # your Medium username
quora_username:         # your Quora username
publons_id:             # your ID on Publons
research_gate_profile:  # your profile on ResearchGate
blogger_url:            # your blogger URL
work_url:               # work page URL
youtube_id:             # your youtube channel id
instagram_id:           # your instagram id
discord_id:             # your discord id (executable to copy to clipboard)
zotero_username:        # your zotero username
stackoverflow_id:       #your stackoverflow id
twitch_id:              # your twitch id
kaggle_id:              # your kaggle id
lastfm_id:              # your lastfm id
spotify_id:             # your spotify id
pinterest_id:           # your pinterest id
unsplash_id:            # your unsplash id
flickr_id:              # your flickr id

contact_note:           >
  Best way to reach me is via email — I check it daily.

# -----------------------------------------------------------------------------
# Analytics and search engine verification
# -----------------------------------------------------------------------------

google_analytics:       # your Google Analytics property ID — leave blank if none
panelbear_analytics:    # your Panelbear analytics site ID
cronitor_analytics:     # your Cronitor RUM analytics site ID
pirsch_analytics:       # your Pirsch analytics site ID
openpanel_analytics:    # your OpenPanel analytics site ID

# you SHOULD NOT use both Cloudflare and GoatCounter at the same time.
cloudflare_analytics:   # your Cloudflare analytics site tag
goatcounter_analytics:  # your goatcounter analytics site name (e.g. yoursite from yoursite.goatcounter.com)
matomo_analytics_site:  # your Matomo analytics URL (without the protocol)
matomo_analytics_id:    # your Matomo analytics site id

google_site_verification:           # out your google-site-verification ID (Google Search Console)
bing_site_verification:             # out your bing-site-verification ID (Bing Webmaster)
yandex_site_verification:           # out your yandex-verification ID (Yandex Webmaster)
naver_site_verification:            # out your naver-site-verification ID (Naver Webmaster)
baidu_site_verification:            # out your baidu site verification code (Baidu Webmaster Tools)

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------

blog_name:              arani roy
blog_description:       a personal blog
permalink:              /blog/:year/:title/
lsi:                    false # produce an index for related posts

# Pagination
pagination:
  enabled:              true

# Comments
disqus_shortname:                   # put your disqus shortname

# External sources
external_sources: # array of links to external sources for blog posts (e.g. medium.com/@username)

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  news:
    defaults:
      layout: post
    output: true
    permalink: /news/:path/
  projects:
    output: true
    permalink: /projects/:path/
  books:
    output: true
    permalink: /books/:path/
  teachings:
    output: true
    permalink: /teachings/:path/

news_limit:                         5

# -----------------------------------------------------------------------------
# Jekyll Scholar
# -----------------------------------------------------------------------------

scholar:

  last_name:                        [Roy]
  first_name:                       [Arani, A.]

  style:                            apa
  locale:                           en

  source:                           /_bibliography/
  bibliography:                     papers.bib
  bibliography_template:            bib
  # Note: if you have latex math in your bibtex, the latex filter
  # preprocesses your bibtex, and then includes the latex in the html.
  # This requires pandoc to be installed locally.
  bibtex_filters:                   [latex, smallcaps, superscript]

  replace_strings:                  true
  join_strings:                     true

  details_dir:                      bibliography
  details_layout:                   bibtex.html
  details_link:                     Details

  query:                            "@*"

# Filter out certain bibtex entry keywords used internally from the bib output
filtered_bibtex_keywords:           [abbr, abstract, arxiv, bibtex_show, html, pdf, selected, supp, blog, code, poster, slides, website, preview, altmetric, dimensions, google_scholar_stats, inspirehep_id, additional_info]

# Display different badges for publications
enable_publication_badges:
  altmetric:                        false
  dimensions:                       false
  google_scholar:                   false
  inspirehep:                       false
  semantic_scholar:                 false

# Disable publication categories
enable_publication_thumbnails:      false
enable_publication_categories:      true

# -----------------------------------------------------------------------------
# Tabs and Social
# -----------------------------------------------------------------------------

# how the tabs and social info will be sorted: "alphabetical" or "custom"
order_type:                         'custom'

# -----------------------------------------------------------------------------
# Display Settings
# -----------------------------------------------------------------------------

display_tags:                       ['formatting', 'images', 'links', 'math', 'code', 'comments', 'videos', 'audios', 'tikzjax']
display_categories:                 ['sample-posts']

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

# Markdown and syntax highlight
markdown:               kramdown
highlighter:            rouge
highlight_theme_light:  github       # https://github.com/jwarby/jekyll-pygments-themes
highlight_theme_dark:   native       # https://github.com/jwarby/jekyll-pygments-themes
kramdown:
  input:                GFM
  syntax_highlighter_opts:
    css_class:          'highlight'
    span:
      line_numbers:     false
    block:
      line_numbers:     false
      start_line:       1

# Includes & excludes
include:                ['_pages']
exclude:
  - bin
  - CITATION.cff
  - CNAME
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - lighthouse_results
  - package-lock.json
  - package.json
  - purgecss.config.js
  - README.md
  - readme_preview
  - vendor

keep_files:
  - CNAME
  - .nojekyll
  - .git
