news_limit:                         6

# -----------------------------------------------------------------------------
# Jekyll Scholar
# -----------------------------------------------------------------------------

scholar:

  last_name:                        [Roy]
  first_name:                       [Arani, A.]

  style:                            apa
  locale:                           en

  source:                           /_bibliography/
  bibliography:                     papers.bib
  bibliography_template:            bib
  bibtex_filters:                   [latex, smallcaps, superscript]

  replace_strings:                  true
  join_strings:                     true

  details_dir:                      bibliography
  details_layout:                   bibtex.html
  details_link:                     Details

  query:                            "@*"

filtered_bibtex_keywords:           [abbr, abstract, arxiv, bibtex_show, html, pdf, selected, supp, blog, code, poster, slides, website, preview, altmetric, dimensions, google_scholar_stats, inspirehep_id, additional_info]

enable_publication_badges:
  altmetric:                        false
  dimensions:                       false
  google_scholar:                   false
  inspirehep:                       false
  semantic_scholar:                 false

enable_publication_thumbnails:      false
enable_publication_categories:      true

# -----------------------------------------------------------------------------
# Tabs and Social
# -----------------------------------------------------------------------------

order_type:                         'custom'

# -----------------------------------------------------------------------------
# Display Settings
# -----------------------------------------------------------------------------

display_tags:                       ['formatting', 'images', 'links', 'math', 'code', 'comments', 'videos', 'audios', 'tikzjax']
display_categories:                 ['sample-posts']

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

markdown:               kramdown
highlighter:            rouge
highlight_theme_light:  github
highlight_theme_dark:   native
kramdown:
  input:                GFM
  syntax_highlighter_opts:
    css_class:          'highlight'
    span:
      line_numbers:     false
    block:
      line_numbers:     false
      start_line:       1

include:                ['_pages']
exclude:
  - bin
  - CITATION.cff
  - CNAME
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - lighthouse_results
  - package-lock.json
  - package.json
  - purgecss.config.js
  - README.md
  - readme_preview
  - vendor

keep_files:
  - CNAME
  - .nojekyll
  - .git
